<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SJK(C) Bahau Adventure</title><link rel="stylesheet" href="style.css"></head><body>
<section id="home" class="screen active hero"><div class="shade"></div><div class="card"><b class="pill">SJK(C) BAHAU</b><h1>校园大冒险<br><span>KATA GANDA</span></h1><p>Belajar Bahasa Melayu Melalui Pengembaraan!</p><button id="new">🎮 PERMAINAN BAHARU</button><button id="cont">▶ TERUSKAN</button><button id="rank">🏆 RANKING</button><button id="bgm">🔊 BGM: ON</button></div><div class="kid">👦</div></section>
<section id="profile" class="screen plain"><div class="card"><button class="back home">← HOME</button><h2>Pilih Wira Sekolah</h2><div class="avatars"><button class="av sel" data-av="boy">👦<small>Aiman</small></button><button class="av" data-av="girl">👧<small>Mei Mei</small></button></div><input id="name" placeholder="Nama murid"><select id="cls"><option value="">Pilih kelas</option><option>3M</option><option>3K</option><option>3B</option><option>3C</option></select><p id="err"></p><button id="enter">MASUK KE PETA</button></div></section>
<section id="map" class="screen map"><header><button class="home">🏠</button><b id="who"></b><span>⭐ <b id="stars">0</b></span><span>🪙 <b id="money">0</b></span></header><div class="mapbox"><h2>Peta Pengembaraan</h2><div id="nodes"></div></div></section>
<section id="game" class="screen game"><header><button id="pause">☰</button><span>❤️ <b id="life">3</b></span><span>⭐ <b id="score">0</b></span><span>🪙 <b id="coin">0</b></span><span id="prog">1/8</span></header><main id="scene"><div class="shade"></div><div class="mission"><small id="label"></small><h2 id="q"></h2></div><div id="area"></div><div id="feed"></div><div class="runner">👦</div></main></section>
<section id="done" class="screen plain"><div class="card"><div class="trophy">🏆</div><h2 id="doneTitle">Tahniah!</h2><p id="doneText"></p><div class="stats"><div>Markah<b id="dscore"></b></div><div>Betul<b id="dcorr"></b></div><div>Bintang<b id="dstars"></b></div><div>Syiling<b id="dcoin"></b></div></div><button id="next">TERUSKAN</button><button id="review">📖 SEMAK KESILAPAN</button><button class="tomap">🗺️ KEMBALI KE PETA</button></div></section>
<section id="reviewPage" class="screen plain"><div class="card wide"><button id="backDone" class="back">← KEPUTUSAN</button><h2>Semak Kesilapan</h2><div id="reviewList"></div></div></section>
<section id="ranking" class="screen plain"><div class="card"><button class="back home">← HOME</button><h2>🏆 Top 10 Wira Bahasa</h2><div id="rankList"></div></div></section>
<div id="overlay"><div class="card"><h2>Permainan Dijeda</h2><button id="resume">▶ TERUSKAN</button><button id="restart">↻ MULA SEMULA</button><button class="tomap">🗺️ KEMBALI KE PETA</button></div></div>
<script src="game.js"></script></body></html>
