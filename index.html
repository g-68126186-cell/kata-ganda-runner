<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kata Ganda Runner Tahun 3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="start" class="screen active">
  <div class="card">
    <div class="tag">BM Cikgu Tan</div>
    <h1>KATA GANDA<br><span>RUNNER</span></h1>
    <p>Tahun 3 · Belajar Sambil Berlari!</p>
    <div class="avatars">
      <button class="avatar selected" data-avatar="boy">👦<span>Aiman</span></button>
      <button class="avatar" data-avatar="girl">👧<span>Mei Mei</span></button>
    </div>
    <label>Nama Murid<input id="name" placeholder="Contoh: Mei Xin"></label>
    <label>Kelas
      <select id="className">
        <option value="">Pilih kelas</option><option>3M</option><option>3K</option><option>3B</option><option>3C</option><option>Lain-lain</option>
      </select>
    </label>
    <button id="startBtn" class="main-btn">MULA BERLARI!</button>
    <div id="error"></div>
  </div>
</div>

<div id="game" class="screen">
  <div class="hud">
    <div>⭐ <b id="score">0</b></div>
    <div>🪙 <b id="coins">0</b></div>
    <div>❤ <b id="lives">3</b></div>
    <div>⏱ <b id="time">60</b>s</div>
  </div>
  <div class="mission">
    <small>MISI SEKARANG</small>
    <strong id="mission">Cari Kata Ganda Penuh</strong>
    <span id="combo"></span>
  </div>
  <div class="world">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="school">SEKOLAH</div>
    <div class="trees">🌳　🌳　🌳　🌳　🌳</div>
    <div class="road"></div>
    <div id="runner" class="runner boy lane1">
      <div class="bubble" id="bubble">Jom!</div>
      <div class="head"><div class="hair"></div><div class="eyes">•　•</div><div class="mouth">⌣</div></div>
      <div class="body"></div><div class="leg l"></div><div class="leg r"></div>
    </div>
    <div id="choices" class="choices">
      <button data-lane="0"></button>
      <button data-lane="1"></button>
      <button data-lane="2"></button>
    </div>
    <div id="feedback"></div>
  </div>
  <div class="progress"><div id="bar"></div><span id="count">1 / 15</span></div>
</div>

<div id="result" class="screen">
  <div class="card result-card">
    <div class="trophy">🏆</div>
    <h2>Tahniah!</h2>
    <p id="message"></p>
    <div class="grid">
      <div><span>Nama</span><b id="rName"></b></div>
      <div><span>Kelas</span><b id="rClass"></b></div>
      <div><span>Markah</span><b id="rScore"></b></div>
      <div><span>Betul</span><b id="rCorrect"></b></div>
      <div><span>Syiling</span><b id="rCoins"></b></div>
      <div><span>Combo Terbaik</span><b id="rCombo"></b></div>
    </div>
    <div id="stars" class="stars"></div>
    <button id="copyBtn" class="main-btn">SALIN MARKAH</button>
    <button id="sendBtn" class="blue-btn">HANTAR KEPADA GURU</button>
    <button id="againBtn" class="soft-btn">MAIN SEMULA</button>
    <p id="note"></p>
  </div>
</div>
<script src="questions.js"></script>
<script src="game.js"></script>
</body>
</html>
